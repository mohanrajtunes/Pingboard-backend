services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pingboard
      POSTGRES_USER: pingboard
      POSTGRES_PASSWORD: pingboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingboard -d pingboard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment: &env
      DATABASE_URL: postgresql://pingboard:pingboard@db:5432/pingboard
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: sh -c "sleep 15 && celery -A config worker -l info"
    env_file: .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    command: sh -c "sleep 15 && celery -A config beat -l info"
    env_file: .env
    environment: *env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata: